name: PHP FPM Debian trixie CI

on:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-php
  cancel-in-progress: true

env:
  FPM_VERSION: fpm-debian-trixie

jobs:
  build_php_fpm:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one version failing shouldn't cancel the other
      matrix:
        php: [ "8.5", "8.6" ]
    env:
      PHP_VERSION: ${{ matrix.php }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Setup docker buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        #build-args: BASE_IMAGE=php:${{ env.PHP_VERSION }}-${{ env.FPM_ALPINE_VERSION }}
        context: ./php-${{ env.PHP_VERSION }}/${{ env.FPM_VERSION }}
        file: ./php-${{ env.PHP_VERSION }}/${{ env.FPM_VERSION }}/Dockerfile
        builder: ${{ steps.buildx.outputs.name }}
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/php:${{ env.PHP_VERSION }}-${{ env.FPM_VERSION }}
        #cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/php:${{ env.PHP_VERSION }}-${{ env.FPM_ALPINE_VERSION }}-bcache
        #cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/php:${{ env.PHP_VERSION }}-${{ env.FPM_ALPINE_VERSION }}-bcache,mode=max
        platforms: linux/amd64,linux/arm64
