name: PHP FPM Debian trixie

# Runs on the Forgejo runner
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-php
  cancel-in-progress: true

env:
  REGISTRY: 10.10.10.5:5000   # plain-HTTP registry; the runner's Docker trusts it
  FPM_VERSION: fpm-debian-trixie

jobs:
  build_php_fpm:
    name: PHP ${{ matrix.php }}
    runs-on: debian           # on the ci-runner container itself, which has Docker
    strategy:
      fail-fast: false        # one version failing shouldn't cancel the other
      matrix:
        php: [ "8.5", "8.6" ]
    env:
      PHP_VERSION: ${{ matrix.php }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: |
        TAG="${PHP_VERSION}-${FPM_VERSION}"
        docker build \
          -t "${REGISTRY}/php:${TAG}" \
          -t "${REGISTRY}/php:${TAG}-${GITHUB_SHA::12}" \
          "./php-${PHP_VERSION}/${FPM_VERSION}"

    - name: Push
      run: |
        TAG="${PHP_VERSION}-${FPM_VERSION}"
        docker push "${REGISTRY}/php:${TAG}"
        docker push "${REGISTRY}/php:${TAG}-${GITHUB_SHA::12}"
